services:
  # ==================== Go 后端 ====================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oj-backend
    restart: always
    environment:
      DB_HOST: host-machine
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-dsw123456}
      DB_NAME: ${DB_NAME:-onlinepractice}
      REDIS_HOST: host-machine
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dsw123456}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JUDGE_WORKERS: ${JUDGE_WORKERS:-5}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_BUCKET_AVATAR: ${MINIO_BUCKET_AVATAR:-oj-avatar}
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    depends_on:
      - rabbitmq
    extra_hosts:
      - "host-machine:host-gateway"
    networks:
      - oj-net

  # ==================== RabbitMQ ====================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: oj-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    networks:
      - oj-net

  # ==================== 前端 Nginx ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oj-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - oj-net

networks:
  oj-net:
    driver: bridge
